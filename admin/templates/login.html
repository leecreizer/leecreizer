{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block guest_body %}
<div class="login-card">
  <div class="logo-mark">DA</div>
  <span class="eyebrow">Design Admin · Sign in</span>
  <h1>설계 어드민</h1>
  <p class="muted">유통 채널별 설계 콘텐츠 관리 시스템</p>
  <form method="post">
    <label>아이디
      <input name="username" required autofocus autocomplete="username">
    </label>
    <label>비밀번호
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary btn-block" type="submit">로그인</button>
  </form>
  <p class="muted small">초기 계정: admin / admin1234</p>
</div>
{% endblock %}
